<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Be You Clinic · Skin | Hair | Body · TTDI, Kuala Lumpur</title>
<meta name="description" content="Be You Clinic in Taman Tun Dr Ismail (TTDI), Kuala Lumpur. Doctor-led skin, hair and body treatments. Book a consultation on WhatsApp.">
<link rel="canonical" href="https://beyouclinic.my/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://beyouclinic.my/">
<meta property="og:title" content="Be You Clinic · TTDI, Kuala Lumpur">
<meta property="og:description" content="Doctor-led skin, hair and body treatments in TTDI. Book a consultation on WhatsApp.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&family=Noto+Serif+SC:wght@500&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: sticky bilingual header → arch hero → concern-led treatment grid → doctor → family credits → journey → visit/booking. */
:root{
  /* golden palette: --plum is now the deep gold used for buttons and accents */
  --bg:#FBF8F2; --surface:#FFFFFF; --ink:#2A2117; --muted:#6F6353; --line:#EADFCB;
  --plum:#8A6421; --plum-soft:#F5EBD7; --gold:#B8893B; --on-plum:#FFFBF3;
  --arch-a:#F6EAD0; --arch-b:#DDB872; --arch-c:#9C7229;
  --sheen:linear-gradient(135deg,#7E5A1C 0%,#B8893B 45%,#D9B56E 70%,#9C7229 100%);
  --display:"Marcellus","Noto Serif SC",Georgia,serif;
  --body:"Figtree","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14110C; --surface:#1E1912; --ink:#F4ECDD; --muted:#B3A68F; --line:#3A3122;
  --plum:#DDB872; --plum-soft:#2C2416; --gold:#E2C07F; --on-plum:#1A140B;
  --arch-a:#3A2F1C; --arch-b:#7A5C27; --arch-c:#C9A158;
  --sheen:linear-gradient(135deg,#B8893B 0%,#E6C687 50%,#C9A158 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110C; --surface:#1E1912; --ink:#F4ECDD; --muted:#B3A68F; --line:#3A3122;
  --plum:#DDB872; --plum-soft:#2C2416; --gold:#E2C07F; --on-plum:#1A140B;
  --arch-a:#3A2F1C; --arch-b:#7A5C27; --arch-c:#C9A158;
  --sheen:linear-gradient(135deg,#B8893B 0%,#E6C687 50%,#C9A158 100%); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
html[lang="zh"] body{letter-spacing:.02em}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
html[lang="zh"] h1,html[lang="zh"] h2,html[lang="zh"] h3{font-weight:500;line-height:1.3}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="zh"] .eyebrow{letter-spacing:.3em}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--plum);background:var(--sheen);color:var(--on-plum);padding:12px 20px;border-radius:999px;font:600 15px var(--body);cursor:pointer;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--plum)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.logo img{height:46px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img{filter:invert(1) sepia(.35) brightness(1.05)}}
:root[data-theme="dark"] .logo img{filter:invert(1) sepia(.35) brightness(1.05)}
@media (max-width:480px){.logo img{height:36px}}
.logo .mark{width:40px;height:40px;border-radius:50%;background:var(--sheen);color:var(--on-plum);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.logo .word{font-family:var(--display);font-size:24px;line-height:1;background:var(--sheen);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav{display:flex;gap:18px;margin-left:auto;font-size:14px;white-space:nowrap}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--plum);color:var(--on-plum)}
@media (max-width:1240px){nav{display:none}.lang{margin-left:auto}}
.lang button,header .btn{white-space:nowrap}
@media (max-width:1360px) and (min-width:1241px){nav{gap:14px;font-size:13.5px}.lang button{padding:6px 10px}}
@media (max-width:640px){.bar .btn{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:64px 72px}
.hero h1{font-size:clamp(40px,6vw,72px);margin-block:14px 20px}
.hero h1 em{font-style:normal;color:var(--plum)}
.hero .lede{font-size:18px;color:var(--muted);max-width:34em}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{display:flex;flex-wrap:wrap;gap:28px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.facts div{display:grid;gap:2px}
.facts b{font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.arch{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:999px 999px var(--r) var(--r);background:
  radial-gradient(60% 45% at 30% 30%,var(--arch-a),transparent 70%),
  radial-gradient(70% 55% at 75% 70%,var(--arch-b),transparent 72%),
  linear-gradient(170deg,var(--arch-a),var(--arch-c));overflow:hidden}
.arch .halo{position:absolute;inset:18% 20% auto;aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,var(--on-plum) 55%,transparent);animation:breathe 7s ease-in-out infinite}
.arch .halo.two{inset:26% 28% auto;animation-delay:-3.5s}
@keyframes breathe{50%{transform:scale(1.06);opacity:.6}}
@media (prefers-reduced-motion:reduce){.arch .halo{animation:none}}
.arch .tag{position:absolute;left:18px;right:18px;bottom:18px;background:var(--surface);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;box-shadow:0 10px 30px rgba(60,40,10,.18)}
.arch .tag b{font-family:var(--display);font-weight:400;font-size:18px}
.arch .tag span{font-size:13px;color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-block:40px 56px}.arch{max-width:420px;width:100%;margin-inline:auto}}

/* sections */
section.block{padding-block:72px;border-top:1px solid var(--line)}
.head{display:grid;gap:12px;max-width:640px;margin-bottom:36px}
.head h2{font-size:clamp(30px,4vw,44px)}
.head p{color:var(--muted)}

/* icons & photos */
.arch-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.ico{width:46px;height:46px;border-radius:50%;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;flex-shrink:0}
.ico svg,.sico svg,.vico svg{width:24px;height:24px}
.card-top{display:flex;align-items:center;gap:12px}
.pillar .ico{margin-bottom:4px}
.vico{color:var(--gold);display:block}
.sico{color:var(--gold);display:flex;gap:6px}
.steps li::before{position:absolute;top:0;right:0;font-size:22px}
.steps li{position:relative}

/* signature */
.sig{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sig-intro{background:var(--sheen);color:var(--on-plum);padding:40px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sig-intro .eyebrow{color:var(--on-plum);opacity:.85}
.sig-intro h2{font-size:clamp(34px,4.5vw,54px)}
.sig-zh{font-family:"Noto Serif SC",var(--display);font-size:24px;letter-spacing:.3em}
.sig-lede{font-size:17px;opacity:.92;max-width:30em}
.sig-price{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;margin-top:6px}
.sig-price div{display:grid;gap:2px}
.sig-price span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.sig-price s{font-size:22px;opacity:.75}
.sig-price b{font-family:var(--display);font-weight:400;font-size:56px;line-height:1}
.sig-cta{align-self:flex-start;background:var(--on-plum);color:var(--plum);border-color:var(--on-plum)}
.sig-intro .note{color:var(--on-plum);opacity:.8;font-size:12px}
.sig-steps{list-style:none;margin:0;padding:32px 36px;display:grid;gap:22px;align-content:center;min-width:0}
.sig-steps li{display:grid;gap:6px}
.sig-steps .tag-k{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sig-steps h3{font-size:28px}
.sig-steps p{color:var(--muted)}
.sig-steps li+li{border-top:1px solid var(--line);padding-top:20px}
.sig-steps .result p{color:var(--ink);font-family:var(--display);font-size:22px;line-height:1.35}
@media (max-width:860px){.sig{grid-template-columns:1fr}.sig-intro{padding:28px}.sig-steps{padding:24px}}

/* about */
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px 48px;align-items:start}
.about .head p{color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pillar{border-top:2px solid var(--gold);padding-top:16px;display:grid;gap:8px;min-width:0}
.pillar .k{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.pillar h3{font-size:24px}
.pillar p{color:var(--muted);font-size:15px}
.values{grid-column:1/-1;list-style:none;margin:8px 0 0;padding:20px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.values li{display:grid;gap:4px;min-width:0}
.values b{font-weight:600}
.values span{color:var(--muted);font-size:15px}
.maplink{color:var(--plum);font-weight:600;text-underline-offset:4px}
@media (max-width:860px){.about{grid-template-columns:1fr}.values{grid-template-columns:1fr}}
@media (max-width:520px){.pillars{grid-template-columns:1fr}}

/* concerns */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;font:500 14px var(--body);cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--plum)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .area{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:24px}
.card p{color:var(--muted);font-size:15px}
.card ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px;font-size:15px}
.card li{display:flex;justify-content:space-between;gap:12px}
.card li small{color:var(--gold);font-weight:600;font-size:12px;white-space:nowrap}
.card.wide{grid-column:1/-1}
.card.wide ul{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.card.wide ul{grid-template-columns:1fr}}
.card .ask{margin-top:auto;align-self:flex-start;background:none;border:0;padding:0;color:var(--plum);font:600 14px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* technology */
.tech-feature{display:grid;grid-template-columns:1.15fr .85fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.tech-feature figure{margin:0;background:#FFFFFF;display:grid;place-items:center;min-width:0}
.tech-feature figure img{width:100%;height:auto;display:block}
.tech-copy{padding:28px;display:flex;flex-direction:column;gap:12px;min-width:0;border-left:1px solid var(--line)}
.tech-copy h3{font-size:30px}
.tech-copy p{color:var(--muted)}
.badge{align-self:flex-start;background:var(--sheen);color:var(--on-plum);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.ticks li{padding-left:22px;position:relative}
.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--sheen)}
.good{font-size:14px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.good b{color:var(--plum)}
.tech-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.tech-feature{grid-template-columns:1fr}.tech-copy{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:600px){.tech-pair{grid-template-columns:1fr}.tech-copy{padding:20px}}

/* doctor */
.doc{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:center}
.portrait{aspect-ratio:3/4;max-width:100%;border-radius:var(--r);background:linear-gradient(160deg,var(--plum-soft),var(--arch-b));display:grid;place-items:end start;padding:20px}
.portrait{padding:0;overflow:hidden;background:var(--plum-soft)}
.portrait{aspect-ratio:545/1185;width:100%;max-width:380px;justify-self:center;background:linear-gradient(180deg,var(--plum-soft),var(--arch-a))}
.portrait img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block}
.doc .creds{color:var(--muted);font-size:14px;margin-top:8px}
.doc blockquote{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);line-height:1.35;margin:18px 0 24px;color:var(--ink)}
.doc dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0;border-top:1px solid var(--line);padding-top:20px}
.doc dt{font-family:var(--display);font-size:26px}
.doc dd{margin:0;color:var(--muted);font-size:14px}
@media (max-width:760px){.doc{grid-template-columns:1fr}.portrait{max-width:300px}}

/* credits */
.credits{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.credits ul.points{display:grid;gap:16px;padding:0;margin:24px 0 0;list-style:none}
.credits ul.points li{display:grid;gap:2px;padding-left:18px;border-left:2px solid var(--gold)}
.credits ul.points b{font-weight:600}
.credits ul.points span{color:var(--muted);font-size:15px}
.wallet{background:var(--sheen);color:var(--on-plum);border-radius:var(--r);padding:28px;display:grid;gap:20px}
.wallet .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.wallet .top b{font-family:var(--display);font-weight:400;font-size:20px}
.wallet .ex{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;border:1px solid currentColor;padding:2px 8px;border-radius:999px}
.wallet .bal{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.wallet .bal small{font-family:var(--body);font-size:14px;opacity:.75;margin-left:8px}
.meter{height:6px;border-radius:6px;background:color-mix(in srgb,var(--on-plum) 25%,transparent);overflow:hidden}
.meter i{display:block;height:100%;width:62%;background:var(--gold)}
.wallet table{width:100%;border-collapse:collapse;font-size:14px}
.wallet td{padding:10px 0;border-top:1px solid color-mix(in srgb,var(--on-plum) 22%,transparent)}
.wallet td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.wallet td span{opacity:.75}
@media (max-width:860px){.credits{grid-template-columns:1fr}}

/* journey */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;gap:8px;align-content:start}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--display);font-size:32px;color:var(--gold)}
.steps b{font-size:17px;font-weight:600}
.steps span{color:var(--muted);font-size:15px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* visit */
.visit{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px}
.info{display:grid;gap:20px;align-content:start}
.info div{display:grid;gap:4px}
.info b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ph{background:var(--plum-soft);color:var(--plum);padding:1px 6px;border-radius:4px;font-size:14px}
form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
form .full{grid-column:1/-1}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:400 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.note{font-size:13px;color:var(--muted)}
.ok{grid-column:1/-1;background:var(--plum-soft);color:var(--plum);border-radius:10px;padding:12px 14px;font-size:14px}
@media (max-width:860px){.visit{grid-template-columns:1fr}}
@media (max-width:520px){form{grid-template-columns:1fr;padding:20px}}

footer{border-top:1px solid var(--line);padding-block:32px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
</style>
</head>
<body>

const ICON = {lumps: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16c2.5 0 3-4 5.5-4s3 4 5.5 4"/><circle cx="17.5" cy="9" r="3"/><path d="M3 20h18"/></svg>`, general: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`, women: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6"/></svg>`, glow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>`, tight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-3.6 0-6 2.8-6 6.8C6 15 9 20 12 20s6-5 6-10.2C18 5.8 15.6 3 12 3z"/><path d="M9 12l3-3 3 3M12 9v6"/></svg>`, acne: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1.2"/><circle cx="14.5" cy="9" r="1"/><circle cx="13.5" cy="14.5" r="1.4"/></svg>`, removal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 13.5h6L10 22l8-11.5h-6z"/></svg>`, contour: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3c0 5 3.5 6 3.5 9S8 16 8 21M16 3c let lang = "en", area = "all";

function renderConcerns(){
  const g = document.getElementById("concern-grid");
  g.innerHTML = "";
  CONCERNS.filter(c => area==="all" || [].concat(c.area).includes(area)).forEach(c=>{
    const el = document.createElement("article");
    el.className = "card" + (c.wide && area==="all" ? " wide" : "");
    const [title, desc] = c[lang];
    el.innerHTML = `<div class="card-top"><span class="ico">${ICON[c.id]||""}</span><span class="area">${[].concat(c.area).map(a=>T[lang]["area."+a]).join(" · ")}</span></div><h3>${title}</h3><p>${desc}</p>
      <ul>${c.t.map(x=>`<li><span>${lang==="en"?x[0]:lang==="zh"?x[1]:x[3]}</span>${x[2]?`<small>${SIG[lang]}</small>`:""}</li>`).join("")}</ul>
      <button type="button" class="ask" data-id="${c.id}">${T[lang].ask}</button>`;
    g.appendChild(el);
  });
}
function renderSelect(){
  const s = document.getElementById("f-concern"), v = s.value || "glow";
  s.innerHTML = CONCERNS.map(c=>`<option value="${c.id}">${c[lang][0]}</option>`).join("");
  s.value = v;
}
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent = T[l][e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(e=>e.innerHTML = T[l][e.dataset.i18nHtml]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===l));
  renderConcerns(); renderSelect();
  const ok = document.getElementById("f-ok"); ok.hidden = true;
  try{ localStorage.setItem("byc-lang", l) }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  area = b.dataset.area;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  renderConcerns();
}));
document.getElementById("concern-grid").addEventListener("click",e=>{
  const b = e.target.closest(".ask"); if(!b) return;
  document.getElementById("f-concern").value = b.dataset.id;
  document.getElementById("f-lang").value = lang;
  document.getElementById("visit").scrollIntoView({behavior:"smooth"});
  setTimeout(()=>document.getElementById("f-name").focus({preventScroll:true}),500);
});
document.getElementById("sig-book").addEventListener("click",()=>{
  document.getElementById("f-concern").value = "glow";
  document.getElementById("f-lang").value = lang;
  document.getElementById("f-msg").value = ({zh:"我想预约瓷光重建护理（Porcelain Glow Reset）。",ms:"Saya ingin menempah Porcelain Glow Reset."})[lang] || "I'd like to book the Porcelain Glow Reset.";
  document.getElementById("visit").scrollIntoView({behavior:"smooth"});
  setTimeout(()=>document.getElementById("f-name").focus({preventScroll:true}),500);
});
document.getElementById("book").addEventListener("submit",e=>{
  e.preventDefault();
  const ok = document.getElementById("f-ok");
  const v = id => document.getElementById(id).value.trim();
  const name = v("f-name"), phone = v("f-phone"), msg = v("f-msg");
  if(!name || !phone){ ok.textContent = T[lang]["f.err"]; ok.hidden = false; return; }
  const cSel = document.getElementById("f-concern"), lSel = document.getElementById("f-lang");
  const cObj = CONCERNS.find(c=>c.id===cSel.value); const concern = cObj ? cObj.en[0] : "";
  const pref = lSel.options[lSel.selectedIndex] ? lSel.options[lSel.selectedIndex].text : "";
  const lines = [
    "*New consultation request – Be You Clinic website*",
    "",
    "Name: " + name,
    "Mobile: " + phone,
    "Main concern: " + concern,
    "Preferred language: " + pref
  ];
  if(msg) lines.push("Notes: " + msg);
  lines.push("Website language: " + ({en:"English",ms:"Bahasa Melayu",zh:"中文"})[lang]);
  const url = "https://wa.me/60168056836?text=" + encodeURIComponent(lines.join("\n"));
  ok.textContent = T[lang]["f.ok"] + " ";
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = T[lang]["f.open"];
  a.style.fontWeight = "600";
  ok.appendChild(a); ok.hidden = false;
  try{ const w = window.open(url, "_blank"); if(w) w.opener = null; }catch(err){}
});
let start = "en";
try{ const s = localStorage.getItem("byc-lang"); if(s==="zh"||s==="en"||s==="ms") start = s }catch(e){}
if(location.hash==="#zh") start = "zh";
if(location.hash==="#ms"||location.hash==="#bm") start = "ms";
setLang(start);
</script>
